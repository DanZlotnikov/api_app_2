<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple GPT Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <h1>Simple GPT Chat</h1>
    </header>

    <main id="chat" class="chat"></main>

    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-overlay-text">Drop file to attach</div>
    </div>

    <form id="chat-form" class="composer">
      <div id="file-preview" class="file-preview hidden">
        <span id="file-name"></span>
        <button type="button" id="remove-file" title="Remove file">&times;</button>
      </div>
      <div class="composer-row">
        <label for="file-input" class="attach-btn" title="Attach a file">📎</label>
        <input type="file" id="file-input" hidden />
        <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
        <button type="submit" id="send-btn">Send</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
